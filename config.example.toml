# ==============================================================================
# KIMI CODE CLI CONFIGURATION (TEMPLATE DE EXEMPLO)
# ==============================================================================
# Renomeie para config.toml e insira sua API Key do OpenCode Go.
# Maestro Padrao: LongCat (Custo $0.00 com Thinking Tokens e contexto de 128k)
# ==============================================================================

default_model = "longcat-2.5-preview-free"

[general]
temperature = 0.4
max_tokens = 4096
stream = true

# ==============================================================================
# PROVEDOR: OPENCODE GO (API OpenAI-Compatible)
# ==============================================================================
[providers.opencode-go]
type = "openai"
base_url = "https://opencode.ai/zen/go/v1"
api_key = "SEU_OPENCODE_API_KEY_AQUI"
custom_headers = { "x-opencode-session" = "swarm-persistent-cache", "User-Agent" = "kimi-code/2.1.1" }

# ==============================================================================
# MODELOS DE ELITE & ALTA EFICIENCIA (CUSTO ULTRA BAIXO)
# ==============================================================================

# --- NUCLEO GRATUITO & ILIMITADO (MAESTRO PERMANENTE) ---
[models."longcat-2.5-preview-free"]
provider = "opencode-go"
model = "longcat-2.5-preview-free"
max_context_size = 131072
capabilities = ["thinking", "tool_use"]

